# GitHub Actions Workflow for SonarCloud Analysis
# Runs SonarCloud code analysis on pushes to main/master branches

name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    # Manual trigger option

env:
  BUILD_CONFIGURATION: Release
  SOLUTION_PATH: VueNetCrud.sln
  PROJECT_PATH: VueNetCrud.Server/VueNetCrud.Server.csproj
  TEST_PROJECT_PATH: VueNetCrud.Server.Tests/VueNetCrud.Server.Tests.csproj
  DOTNET_VERSION: '9.0.x'

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Restore NuGet packages
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run tests with code coverage
      run: |
        dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration ${{ env.BUILD_CONFIGURATION }} \
          --no-build \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          --verbosity normal \
          --logger trx \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      continue-on-error: true

    - name: Run SonarCloud Analysis
      uses: sonarsource/sonarqube-scan-action@v4.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, auto-provided by GitHub
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # SonarCloud token (required)
      with:
        projectBaseDir: .
        args: >
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
          -Dsonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/Startup.cs,**/*.Tests.cs,**/TestResults/**
          -Dsonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/*.Tests.csproj,**/TestResults/**
          -Dsonar.sourceEncoding=UTF-8
          -Dsonar.csharp.analyzer.projectOutPaths=**/bin/**
          -Dsonar.host.url=https://sonarcloud.io

